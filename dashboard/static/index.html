<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ombre Brain">
    <link rel="icon" type="image/png" href="/static/icon-192.png" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" href="/static/icon-dark-192.png" media="(prefers-color-scheme: dark)">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0e0e16">
    <title>Ombre Brain</title>
    <style>
        :root{
          --bg:#0e0e16;
          --bg-card:#16171f;
          --bg-surface:#1d1e28;
          --bg-input:#22232e;
          --border:#2a2b36;
          --text:#e2e3ea;
          --text-mid:#979aaa;
          --text-dim:#555766;
          --purple:#8b78e6;
          --purple-text:#c4b8f5;
          --purple-dim:rgba(139,120,230,0.1);
          --purple-glow:rgba(139,120,230,0.25);
          --pink:#e8a0b4;
          --pink-dim:rgba(232,160,180,0.1);
          --blue:#7eb8e0;
          --blue-dim:rgba(126,184,224,0.1);
          --shadow:0 2px 12px rgba(0,0,0,0.3)
        }
        [data-theme="light"]{
          --bg:#f5f4fa;
          --bg-card:#ffffff;
          --bg-surface:#f0eef8;
          --bg-input:#edeaf6;
          --border:#ddd8ee;
          --text:#2a2a3a;
          --text-mid:#6b6a80;
          --text-dim:#9896ac;
          --purple-text:#6b5bb8;
          --purple-dim:rgba(139,120,230,0.08);
          --purple-glow:rgba(139,120,230,0.15);
          --pink-dim:rgba(232,160,180,0.08);
          --blue-dim:rgba(126,184,224,0.08);
          --shadow:0 2px 12px rgba(139,120,230,0.08)
        }
        *{
          margin:0;
          padding:0;
          box-sizing:border-box;
          -webkit-tap-highlight-color:transparent
        }
        body{
          background:var(--bg);
          color:var(--text);
          font-family:'Noto Sans SC','PingFang SC',-apple-system,sans-serif;
          -webkit-font-smoothing:antialiased;
          overscroll-behavior:none;
          min-height:100dvh;
          transition:background .3s,color .3s
        }
        input,textarea,select,button{
          font-family:inherit
        }
        input:focus,textarea:focus{
          border-color:var(--purple)!important;
          outline:none;
          box-shadow:0 0 0 2px var(--purple-dim)
        }
        input::placeholder,textarea::placeholder{
          color:var(--text-dim)
        }
        input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus,input:-webkit-autofill:active{
          -webkit-box-shadow:0 0 0 50px var(--bg-input) inset!important;
          -webkit-text-fill-color:var(--text)!important;
          transition:background-color 5000s ease-in-out 0s
        }
        ::-webkit-scrollbar{
          width:3px
        }
        ::-webkit-scrollbar-thumb{
          background:var(--border);
          border-radius:3px
        }
        html{
          overflow-y:scroll
        }
        .stars-bg{
          position:fixed;
          inset:0;
          z-index:0;
          pointer-events:none;
          overflow:hidden
        }
        .star{
          position:absolute;
          border-radius:50%;
          background:var(--purple)
        }
        @keyframes float{
          0%,100%{
          transform:translateY(0) scale(1);
          opacity:.3
        }
        50%{
          transform:translateY(-8px) scale(1.2);
          opacity:.7
        }
        }
        @keyframes slideUp{
          from{
          transform:translateY(16px);
          opacity:0
        }
        to{
          transform:translateY(0);
          opacity:1
        }
        }
        .batch-active .card{
          animation:none!important
        }
        @keyframes fadeIn{
          from{
          opacity:0
        }
        to{
          opacity:1
        }
        }
        @keyframes shake{
          0%,100%{
          transform:translateX(0)
        }
        25%{
          transform:translateX(-6px)
        }
        75%{
          transform:translateX(6px)
        }
        }
        @keyframes toastIn{
          from{
          transform:translate(-50%, calc(-50% - 16px));
          opacity:0
        }
        to{
          transform:translate(-50%, -50%);
          opacity:1
        }
        }
        @keyframes spin{
          to{
          transform:rotate(360deg)
        }
        }
        .input{
          width:100%;
          padding:10px 13px;
          border-radius:10px;
          border:1px solid var(--border);
          background:var(--bg-input);
          color:var(--text);
          font-size:13px;
          transition:border-color .2s,box-shadow .2s
        }
        .textarea{
          resize:vertical;
          line-height:1.7;
          min-height:80px
        }
        .label{
          display:block;
          font-size:11px;
          color:var(--text-dim);
          margin:11px 0 4px
        }
        .ghost-btn{
          padding:9px 16px;
          border-radius:16px;
          border:1.5px solid var(--purple);
          background:transparent;
          color:var(--purple);
          font-size:12px;
          font-weight:600;
          cursor:pointer;
          transition:all .2s;
          display:inline-flex;
          align-items:center;
          gap:4px
        }
        .ghost-btn.pink{
          border-color:var(--pink);
          color:var(--pink)
        }
        .ghost-btn.blue{
          border-color:var(--blue);
          color:var(--blue)
        }
        .ghost-btn.full{
          width:100%;
          justify-content:center;
          padding:11px;
          font-size:13px
        }
        .ghost-btn:disabled{
          opacity:.4;
          cursor:not-allowed
        }
        .ghost-btn:active{
          background:var(--purple);
          color:#fff;
          box-shadow:0 3px 12px var(--purple-glow)
        }
        .ghost-btn.pink:active{
          background:var(--pink);
          color:#fff
        }
        .ghost-btn.blue:active{
          background:var(--blue);
          color:#fff
        }
        @media (hover: hover){
        .ghost-btn:hover{
          background:var(--purple);
          color:#fff;
          box-shadow:0 3px 12px var(--purple-glow)
        }
        .ghost-btn.pink:hover{
          background:var(--pink);
          color:#fff
        }
        .ghost-btn.blue:hover{
          background:var(--blue);
          color:#fff
        }
        .ghost-btn:disabled:hover{
          background:transparent;
          color:var(--purple);
          box-shadow:none
        }
        }
        .chip{
          padding:4px 10px;
          border-radius:12px;
          border:1px solid var(--border);
          background:transparent;
          color:var(--text-mid);
          font-size:11px;
          cursor:pointer;
          transition:all .2s;
          white-space:nowrap
        }
        .chip.active{
          border-color:var(--purple);
          background:var(--purple-dim);
          color:var(--purple);
          font-weight:600
        }
        .card{
          background:var(--bg-card);
          border-radius:11px;
          padding:14px;
          margin-bottom:10px;
          border-left:3px solid var(--purple);
          box-shadow:var(--shadow);
          transition:transform .15s,opacity .15s;
          position:relative
        }
        .card:active{
          transform:scale(.995)
        }
        .card.pinned{
          border-left-color:var(--pink)
        }
        .card.resolved{
          border-left-color:var(--text-dim)
        }
        .card.feel{
          border-left-color:var(--blue)
        }
        .card.digested{
          opacity:0.4;
          border-left-color:var(--border)!important
        }
        .badge{
          font-size:9px;
          padding:2px 7px;
          border-radius:6px;
          font-weight:500;
          white-space:nowrap
        }
        .toast{
          position:fixed;
          top:20%;
          left:50%;
          transform: translate(-50%, -50%); 
          z-index:999;
          padding:8px 16px;
          border-radius:10px;
          background:var(--bg-surface);
          border:1px solid;
          font-size:12px;
          font-weight:500;
          box-shadow:0 4px 20px rgba(0,0,0,.4);
          animation:toastIn .25s ease;
          display:flex;
          align-items:center;
          gap:5px
        }
        .toast.ok{
          border-color:rgba(126,184,224,.3);
          color:var(--blue)
        }
        .toast.err{
          border-color:rgba(232,160,180,.3);
          color:var(--pink)
        }
        .capsule-toast{
          position:fixed;
          top:20px;
          left:50%;
          transform:translateX(-50%) translateY(-60px);
          display:flex;
          align-items:center;
          gap:8px;
          padding:8px 20px;
          background:rgba(255,255,255,.85);
          backdrop-filter:blur(12px);
          -webkit-backdrop-filter:blur(12px);
          border:1px solid rgba(180,160,210,.25);
          border-radius:50px;
          font-size:13px;
          color:#6b5b8a;
          box-shadow:0 4px 20px rgba(120,90,160,.1);
          opacity:0;
          transition:all .5s cubic-bezier(.4,0,.2,1);
          z-index:1000;
          pointer-events:none;
          max-width:min(92vw,560px)
        }
        .capsule-toast.show{
          transform:translateX(-50%) translateY(0);
          opacity:1
        }
        .capsule-toast.is-error{
          border-color:rgba(232,160,180,.35);
          color:#b05a78;
          box-shadow:0 6px 24px rgba(232,160,180,.18)
        }
        .capsule-toast.is-loading{
          border-color:rgba(126,184,224,.35);
          color:#5b7ea8;
          box-shadow:0 6px 24px rgba(126,184,224,.16)
        }
        .capsule-dot{
          width:6px;
          height:6px;
          border-radius:50%;
          background:#a78bda;
          animation:pulse-dot 2s infinite;
          flex-shrink:0
        }
        .capsule-toast.is-error .capsule-dot{
          background:#e8a0b4
        }
        .capsule-toast.is-loading .capsule-dot{
          background:#7eb8e0
        }
        .capsule-text{
          display:block;
          white-space:pre-wrap;
          word-break:break-word;
          line-height:1.5
        }
        .capsule-overlay{
          position:fixed;
          inset:0;
          z-index:200;
          background:rgba(15,14,22,.24);
          backdrop-filter:blur(8px);
          -webkit-backdrop-filter:blur(8px);
          display:flex;
          align-items:center;
          justify-content:center;
          padding:20px;
          animation:fadeIn .2s ease
        }
        .capsule-panel{
          width:100%;
          max-width:420px;
          background:rgba(255,255,255,.82);
          backdrop-filter:blur(18px);
          -webkit-backdrop-filter:blur(18px);
          border:1px solid rgba(180,160,210,.3);
          border-radius:26px;
          box-shadow:0 18px 60px rgba(120,90,160,.16);
          padding:22px 20px;
          color:var(--text)
        }
        .capsule-panel.wide{
          max-width:580px
        }
        .capsule-panel-title{
          font-size:15px;
          font-weight:700;
          text-align:center;
          margin-bottom:6px;
          color:#6b5b8a
        }
        .capsule-panel-subtitle{
          font-size:11px;
          color:var(--text-dim);
          text-align:center;
          margin-bottom:14px;
          line-height:1.6
        }
        .capsule-panel-actions{
          display:flex;
          gap:8px;
          justify-content:center;
          margin-top:14px;
          flex-wrap:wrap
        }
        .capsule-inline-panel{
          margin-top:12px;
          background:rgba(255,255,255,.78);
          backdrop-filter:blur(16px);
          -webkit-backdrop-filter:blur(16px);
          border:1px solid rgba(180,160,210,.28);
          border-radius:24px;
          box-shadow:0 12px 38px rgba(120,90,160,.12);
          padding:16px 14px;
          animation:slideUp .2s ease
        }
        .capsule-inline-panel .info-box{
          background:rgba(167,139,218,.12);
          border-color:rgba(167,139,218,.2)
        }
        .modal-overlay{
          position:fixed;
          inset:0;
          z-index:200;
          background:rgba(0,0,0,.5);
          display:flex;
          align-items:center;
          justify-content:center;
          padding:20px;
          animation:fadeIn .15s
        }
        .modal{
          background:var(--bg-surface);
          border-radius:13px;
          padding:22px;
          max-width:360px;
          width:100%;
          text-align:center;
          border:1px solid var(--border)
        }
        .section-hdr{
          text-align:center;
          margin-bottom:14px;
          padding-top:4px
        }
        .section-hdr h2{
          font-size:17px;
          font-weight:700;
          margin-bottom:2px
        }
        .section-hdr p{
          color:var(--text-dim);
          font-size:11px
        }
        .stat-grid{
          display:grid;
          gap:5px;
          margin-bottom:12px
        }
        .stat-card{
          background:var(--bg-card);
          border-radius:9px;
          padding:9px 4px;
          text-align:center;
          box-shadow:var(--shadow)
        }
        .stat-card .val{
          font-size:17px;
          font-weight:700;
          color:var(--purple)
        }
        .stat-card .lbl{
          font-size:9px;
          color:var(--text-dim);
          margin-top:1px
        }
        .info-box{
          padding:8px 10px;
          background:var(--purple-dim);
          border-radius:8px;
          font-size:10px;
          color:var(--text-mid);
          line-height:1.7;
          margin-top:9px
        }
        .info-box b{
          color:var(--purple-text)
        }
        .edit-panel{
          margin-top:8px;
          padding:12px;
          background:var(--bg-surface);
          border-radius:9px;
          animation:slideUp .2s ease
        }
        .tags-row{
          display:flex;
          gap:3px;
          flex-wrap:wrap;
          margin-bottom:6px
        }
        .tag{
          background:var(--purple-dim);
          color:var(--purple);
          padding:2px 7px;
          border-radius:7px;
          font-size:10px;
          font-weight:500
        }
        .meta-row{
          display:flex;
          gap:6px;
          flex-wrap:wrap;
          font-size:10px;
          color:var(--text-dim);
          margin-bottom:4px
        }
        .loading-spinner{
          width:18px;
          height:18px;
          border:2px solid var(--border);
          border-top-color:var(--purple);
          border-radius:50%;
          animation:spin .6s linear infinite;
          display:inline-block
        }
        .page{
          padding:14px 15px 0;
          display:none
        }
        .page.active{
          display:block
        }
        .bottom-nav{
          position:fixed;
          bottom:0;
          left:0;
          right:0;
          z-index:100;
          background:var(--bg);
          transition:background .3s
        }
        [data-theme="light"] .bottom-nav{
          background:var(--bg)
        }
        .bottom-nav-inner{
          display:flex;
          max-width:500px;
          margin:0 auto;
          padding-bottom:max(env(safe-area-inset-bottom),5px)
        }
        .nav-btn{
          flex:1;
          display:flex;
          flex-direction:column;
          align-items:center;
          gap:2px;
          padding:9px 0 4px;
          background:transparent;
          border:none;
          cursor:pointer;
          color:var(--text-dim);
          transition:color .2s;
          font-size:10px
        }
        .nav-btn.active{
          color:var(--purple)
        }
        .nav-btn .dot{
          width:4px;
          height:4px;
          border-radius:2px;
          background:var(--purple);
          margin-top:1px;
          opacity:0;
          transition:opacity .2s
        }
        .nav-btn.active .dot{
          opacity:1
        }
        .top-bar{
          position:sticky;
          top:0;
          z-index:100;
          background:var(--bg);
          border-bottom:none;
          padding:12px 16px;
          padding-top:calc(env(safe-area-inset-top, 0px) + 12px);
          display:flex;
          align-items:center;
          justify-content:space-between;
          transition:background .3s
        }
        [data-theme="light"] .top-bar{
          background:var(--bg)
        }
        .search-box{
          position:relative;
          margin-bottom:8px
        }
        .search-box input{
          padding-left:34px
        }
        .search-box svg{
          position:absolute;
          left:12px;
          top:50%;
          transform:translateY(-50%);
          color:var(--text-dim)
        }
        .search-clear{
          position:absolute;
          right:8px;
          top:50%;
          transform:translateY(-50%);
          background:none;
          border:none;
          cursor:pointer;
          color:var(--text-dim);
          padding:3px
        }
        .filter-toggle{
          display:flex;
          align-items:center;
          gap:3px;
          background:none;
          border:none;
          color:var(--text-mid);
          font-size:11px;
          cursor:pointer;
          padding:1px 0;
          margin-bottom:8px
        }
        .filter-panel{
          background:var(--bg-card);
          border-radius:9px;
          padding:10px 12px;
          margin-bottom:12px;
          animation:slideUp .2s ease
        }
        .toggle-track{
          width:34px;
          height:18px;
          border-radius:9px;
          border:none;
          cursor:pointer;
          position:relative;
          transition:background .2s;
          padding:0;
          flex-shrink:0
        }
        .toggle-knob{
          width:14px;
          height:14px;
          border-radius:7px;
          background:#fff;
          position:absolute;
          top:2px;
          transition:left .2s
        }
        .chart-card{
          background:var(--bg-card);
          border-radius:11px;
          padding:12px 10px 8px;
          margin-bottom:10px;
          box-shadow:var(--shadow)
        }
        .chart-card h3{
          font-size:13px;
          font-weight:600;
          margin:0 0 8px 3px
        }
        .chart-bar{
          display:flex;
          align-items:center;
          gap:6px;
          margin-bottom:5px
        }
        .chart-bar-label{
          font-size:10px;
          color:var(--text-mid);
          width:52px;
          text-align:right;
          flex-shrink:0;
          overflow:hidden;
          text-overflow:ellipsis;
          white-space:nowrap
        }
        .chart-bar-fill{
          height:18px;
          border-radius:4px;
          transition:width .5s ease;
          min-width:2px
        }
        .chart-bar-val{
          font-size:10px;
          color:var(--text-dim);
          flex-shrink:0;
          white-space:nowrap;
          min-width:20px;
          text-align:right
        }
        .login-wrap{
          min-height:100dvh;
          display:flex;
          align-items:center;
          justify-content:center;
          padding:24px;
          position:relative
        }
        .login-card{
          text-align:center;
          width:100%;
          max-width:280px;
          z-index:1
        }
        .login-moon{
          margin:0 auto 24px;
          display:flex;
          align-items:center;
          justify-content:center
        }
        .login-moon svg{
          filter:drop-shadow(0 0 6px rgba(139,120,230,1))
        }
        .theme-btn{
          background:none;
          border:none;
          cursor:pointer;
          color:var(--text-dim);
          padding:4px;
          display:flex;
          align-items:center;
          transition:color .2s
        }
        .theme-btn:hover{
          color:var(--purple)
        }
        input[type="datetime-local"]{
          color-scheme:dark;
          background:var(--bg-input);
          border:1.5px solid var(--border);
          border-radius:8px;
          color:var(--text);
          font-size:13px;
          padding:7px 10px;
          cursor:pointer;
          transition:border-color .2s
        }
        input[type="datetime-local"]:hover{
          border-color:var(--purple)
        }
        input[type="datetime-local"]:focus{
          outline:none;
          border-color:var(--purple);
          box-shadow:0 0 0 2px var(--purple-dim)
        }
        input[type="datetime-local"]::-webkit-calendar-picker-indicator{
          filter:invert(0.6) sepia(1) saturate(3) hue-rotate(220deg);
          cursor:pointer;
          border-radius:4px;
          padding:2px
        }
        input[type="datetime-local"]::-webkit-calendar-picker-indicator:hover{
          filter:invert(0.8) sepia(1) saturate(4) hue-rotate(220deg)
        }
        [data-theme="light"] input[type="datetime-local"]{
          color-scheme:light
        }
        [data-theme="light"] input[type="datetime-local"]::-webkit-calendar-picker-indicator{
          filter:invert(0.3) sepia(1) saturate(3) hue-rotate(220deg)
        }
        input[type="range"]{
          -webkit-appearance:none;
          appearance:none;
          width:100%;
          height:4px;
          border-radius:2px;
          background:var(--border);
          outline:none;
          cursor:pointer;
          --thumb-color:var(--purple)
        }
        input[type="range"]::-webkit-slider-thumb{
          -webkit-appearance:none;
          width:14px;
          height:14px;
          border-radius:50%;
          background:var(--thumb-color);
          cursor:pointer;
          border:none;
          margin-top:0
        }
        input[type="range"]::-moz-range-track{
          height:4px;
          border-radius:2px;
          background:transparent;
          border:none
        }
        input[type="range"]::-moz-range-thumb{
          width:14px;
          height:14px;
          border-radius:50%;
          background:var(--thumb-color);
          cursor:pointer;
          border:none
        }
        .quick-actions{
          display:flex;
          gap:4px;
          flex-wrap:wrap;
          margin-top:6px;
          padding-top:6px;
        }
        .quick-btn{
          padding:4px 10px;
          border-radius:10px;
          border:1px solid var(--border);
          background:transparent;
          color:var(--text-mid);
          font-size:10px;
          cursor:pointer;
          transition:all .15s;
          display:inline-flex;
          align-items:center;
          gap:3px
        }
        @media (hover: hover) {
          .quick-btn:hover{
            border-color:var(--purple);
            color:var(--purple);

                async function doBatchAction(action){

                  lbl={

          }[action],
                  done=0;

              method:'PUT',headers:{
                'Content-Type':'application/json'
              },body:JSON.stringify({

              })
            });
            else if(action==='resolve')await fetch('/api/memories/'+ids[i],{
              method:'PUT',headers:{

              },body:JSON.stringify({
                resolved:true,pinned:false
              })
            });

              method:'PUT',headers:{
                'Content-Type':'application/json'
              },body:JSON.stringify({
                digested:true
              })
            });
            else await fetch('/api/memories/'+ids[i],{

                function toggleEditDomain(id,domain,btn){
          if(!editDomains[id])editDomains[id]=[].concat((memories.find(function(x){
            return x.id===id
          })||{
          }).domain||[]);
          var arr=editDomains[id],idx=arr.indexOf(domain);
          if(idx>=0)arr.splice(idx,1);
          else if(arr.length<3)arr.push(domain);
          var isA=arr.indexOf(domain)>=0;
          btn.classList.toggle('active',isA);
          var gc=getDomainColor(domain);
          if(isA){
            btn.style.borderColor=gc;
            btn.style.color=gc;

          var m=memories.find(function(x){
            return x.id===id
          });
          var isFeel=m&&m.type==='feel';
          var c=(document.getElementById('ed_content_'+id)||{
          }).value||'';
          var imp=parseInt((document.getElementById('ed_imp_val_'+id)||{
          }).textContent||'5');
          var val=parseFloat((document.getElementById('ed_val_val_'+id)||{
          }).textContent||'0.5');
          var aro=parseFloat((document.getElementById('ed_aro_val_'+id)||{
          }).textContent||'0.3');
          var createdInput=(document.getElementById('ed_created_'+id)||{
          }).value||'';
          var body={
            content:c.trim(),importance:imp,valence:val,arousal:aro
          };
          if(createdInput)body.created=createdInput;
          if(!isFeel){
            var n=(document.getElementById('ed_name_'+id)||{
            }).value||'';
            var t=(document.getElementById('ed_tags_'+id)||{
            }).value||'';
            var tags=t.split(/[,，、]/).map(function(x){
              return x.trim()
            }).filter(Boolean);
            var domain=editDomains[id]||(m||{
            }).domain||[];
            body.name=n.trim();
            body.tags=tags;
            body.domain=domain
          }try{
            var res=await fetch('/api/memories/'+id,{
              method:'PUT',headers:{
                'Content-Type':'application/json'
              },body:JSON.stringify(body)
            });

            var up=await res.json();

        async function fixEmbeddings(){
          var btn=document.getElementById('btn_fix_emb');
          if(!btn)return;
          var origLabel=btn.textContent;
          btn.disabled=true; btn.textContent='扫描中...';
          try{
            var r1=await fetch('/api/backfill_embeddings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dry_run:true})});
            var d1=await r1.json();
            if(!r1.ok){ showToast(d1.error||'扫描失败','err'); return; }
            if(d1.missing===0){ showToast('所有 '+d1.total+' 条记忆都已有向量 ✨','ok'); return; }
            if(!confirm('检测到 '+d1.missing+' 条记忆缺少向量索引（共 '+d1.total+' 条），小回无法搜索到这些记忆。\n\n是否立即补建？预计耗时约 '+d1.missing+' 秒。')){ return; }
            btn.textContent='补建中（约 '+d1.missing+' 秒）...';
            var r2=await fetch('/api/backfill_embeddings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})});
            var d2=await r2.json();
            if(!r2.ok){ showToast(d2.error||'补建失败','err'); return; }
            var msg='完成：成功 '+d2.success+'，失败 '+d2.failed;
            showToast(msg, d2.failed>0?'err':'ok');
          }catch(e){
            showToast('出错: '+(e&&e.message?e.message:e),'err');
          }finally{
            btn.disabled=false; btn.textContent=origLabel;
          }
        }
        async function _doExport(endpoint, btnId, fallbackFname){
          var btn=document.getElementById(btnId);
          var orig=btn?btn.textContent:null;
          if(btn){ btn.disabled=true; btn.textContent='打包中...'; }
          try{
            var res=await fetch(endpoint);
            if(!res.ok){ showToast('导出失败 ('+res.status+')','err'); return; }
            var blob=await res.blob();
            var cd=res.headers.get('Content-Disposition')||'';
            var m=cd.match(/filename[^;=\n]*=([^;]*)/);
            var fname=m?m[1].replace(/["']/g,'').trim():fallbackFname;
            var url=URL.createObjectURL(blob);
            var a=document.createElement('a');
            a.href=url; a.download=fname;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('已导出 '+fname+' ✨');
          }catch(e){
            showToast('出错: '+(e&&e.message?e.message:e),'err');
          }finally{
            if(btn){ btn.disabled=false; btn.textContent=orig; }
          }
        }

        async function _importMemoryStaged(inputId, mode, verb){
          var input=document.getElementById(inputId);
          var file=input&&input.files&&input.files[0];
          if(!file)return;
          var dryTimer=null, progressTimer=null;
          try{
            // 阶段 1: dry-run 拿预览（持续 toast 显示已等待秒数，不闪烁）
            var dryStart=Date.now();
            _setPersistToast('扫描 zip 内容中…');
            dryTimer=setInterval(function(){
              var elapsed=Math.floor((Date.now()-dryStart)/1000);
              _setPersistToast('扫描 zip 内容中…（已等待 '+elapsed+' 秒）');
            },1000);
            var fd1=new FormData(); fd1.append('file',file); fd1.append('mode','dry_run');
            var r1=await fetch('/api/import/memories',{method:'POST',body:fd1});
            var d1=await r1.json();
            clearInterval(dryTimer); dryTimer=null;
            _clearToast();
            if(!r1.ok){ showToast(d1.error||'扫描失败','err'); return; }
            var preview;
            if(mode==='merge'){
              preview='合并导入\n\n'+
                'zip 包含记忆：'+d1.import_total+' 条\n'+
                '本地当前记忆：'+d1.local_total+' 条\n'+
                '将新增 '+d1.new_count+' 条（本地不存在）\n'+
                '将跳过 '+d1.conflict_count+' 条（本地已存在）\n\n'+
                '不会修改任何现有记忆，仅添加新增项。新增记忆暂无向量索引，导入完成后请点击「🔧 补建缺失向量」补全。\n\n'+
                '操作前将自动备份当前所有记忆。\n\n是否继续？';
              if(d1.new_count===0){ showToast('zip 中所有记忆本地都已存在，无需合并','ok'); return; }
            } else {
              preview='🔴 替换全部记忆\n\n'+
                'zip 包含记忆：'+d1.import_total+' 条\n'+
                '本地当前记忆：'+d1.local_total+' 条\n'+
                '将删除 '+d1.only_local_count+' 条（本地有但 zip 没有）\n'+
                '将新增 '+d1.new_count+' 条（zip 有但本地没有）\n'+
                '将覆盖 '+d1.conflict_count+' 条（两边都有，以 zip 为准）\n\n'+
                '操作前将自动备份当前所有记忆。如需回滚，将备份文件夹重命名回原位即可恢复。\n\n确认替换？';
            }
            if(!confirm(preview)){ return; }
            // 阶段 2: 真正执行（持续 toast 显示已等待秒数，不闪烁）
            var fd2=new FormData(); fd2.append('file',file); fd2.append('mode',mode);
            var startTime=Date.now();
            _setPersistToast(verb+'中…');
            progressTimer=setInterval(function(){
              var elapsed=Math.floor((Date.now()-startTime)/1000);
              _setPersistToast(verb+'中…（已等待 '+elapsed+' 秒，备份与复制需要时间，请勿关闭页面）');
            },1000);
            var r2=await fetch('/api/import/memories',{method:'POST',body:fd2});
            var d2=await r2.json();
            clearInterval(progressTimer); progressTimer=null;
            _clearToast();
            if(!r2.ok){ showToast(d2.error||(verb+'失败'),'err'); return; }
            var msg;
            if(mode==='merge'){
              msg='合并完成\n\n新增 '+d2.added+' 条 / 失败 '+(d2.failed||0)+' 条\n备份: '+(d2.backup||'(无)');
              if(d2.failed_details && d2.failed_details.length){
                msg += '\n\n失败明细（最多 5 条）：';
                for(var i=0;i<d2.failed_details.length;i++){
                  msg += '\n• '+d2.failed_details[i].file+'\n   '+d2.failed_details[i].error;
                }
              }
            } else {
              msg='恢复完成\n\n当前记忆共 '+d2.import_total+' 条\n备份: '+(d2.backup||'(无)');
            }
            alert(msg);
            try{ loadMemories(); }catch(e){}
          }catch(e){
            showToast('出错: '+(e&&e.message?e.message:e),'err');
          }finally{
            if(dryTimer) clearInterval(dryTimer);
            if(progressTimer) clearInterval(progressTimer);
            input.value='';
          }
        }
        async function importMergeMemoryFile(){ return _importMemoryStaged('cfg_import_mem_file','merge','合并'); }

        function _fmtSize(n){
          if(n<1024)return n+' B';
          if(n<1048576)return (n/1024).toFixed(1)+' KB';
          if(n<1073741824)return (n/1048576).toFixed(1)+' MB';
          return (n/1073741824).toFixed(2)+' GB';
        }

                '<div style="flex:1;min-width:0">' +

              '<div style="color:#666"><b>会产生备份的操作（只 2 种）：</b></div>' +
              '<div style="color:#666;margin-left:8px">' +
                '• 点「📤 合并新记忆」 → 留底当前整套 buckets/<br>' +
                '• 点「🔄 替换全部记忆」 → 留底当前整套 buckets/<br>' +
                '另外：小回部署新版 app.py 时也会留底旧 app.py（这是手工动作不是网页按钮）' +
              '</div>' +
              '<div style="color:#666;margin-top:6px"><b>不产生备份的操作：</b></div>' +
              '<div style="color:#666;margin-left:8px">' +
                '• 任何 📥 导出（只下载到你电脑，服务器不留东西）<br>' +
                '• 日常 hold / grow / 编辑 / 删除记忆（不留快照）<br>' +
                '• 🔧 补建缺失向量（只更新数据库）<br>' +
                '• 📤 导入配置 → <b>直接覆盖，不留备份</b>（config 含 API key，留服务器有安全隐患）' +
              '</div>' +
              '<div style="color:#a14;margin-top:6px;font-size:10px;line-height:1.5">⚠️ 如果你担心导入新 config 后想找回旧 config，请先点「📥 导出配置」把当前 config 下载到你本地电脑，再来做导入。服务器上永远不会有 config 的历史副本。</div>' +
              '<div style="color:#888;margin-top:6px;font-size:10px">🧹 自动维护：每种备份（app.py / 记忆 / 配置 / 早期遗留 共 4 类）系统会各自保留最新 3 条，更旧的在每次产生新备份或服务启动时自动删除，避免长期累积膨胀。下方列表里能看到的备份都在保留范围内，要提前删也可以手动点。</div>' +
            '</div>';
          document.getElementById('modalContainer').innerHTML=
            '<div class="modal-overlay" onclick="closeModal()">' +
            '<div class="modal" onclick="event.stopPropagation()" style="max-width:580px;max-height:85vh;overflow-y:auto;text-align:left">' +
              '<p style="font-size:14px;font-weight:600;margin-bottom:4px;text-align:center">🗂️ 本地备份清单</p>' +
              '<p style="font-size:11px;color:#888;margin-bottom:12px;text-align:center">共 '+d.count+' 项，总占用 '+_fmtSize(d.total_size_bytes)+'</p>' +

        async function deleteBackup(name){
          if(!confirm('确认删除「'+name+'」？删除后无法恢复。')) return;
          try{
            var res=await fetch('/api/backups/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name})});
            var d=await res.json();
            if(!res.ok){ showToast(d.error||'删除失败','err'); return; }
            showToast('已删除 '+name+'（释放 '+_fmtSize(d.freed_bytes||0)+'）');
            showBackupsList();   // 刷新列表
          }catch(e){
            showToast('出错: '+(e&&e.message?e.message:e),'err');
          }
        }
